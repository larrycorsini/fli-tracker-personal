# Fli-Tracker static dashboard — https://flights.larrycorsini.com
# Generated HTML lives in public/ (see generate_flight_report.py + daily_flight_search.sh)

[build]
  command = "echo 'Publishing committed public/'; test -f public/index.html"
  publish = "public"
  # Skip Netlify builds when public/ did not change (saves free-plan minutes).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify.toml"

# Security headers for the public flight dashboard
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service worker must revalidate so daily deploys reach installed PWAs
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest can be cached briefly; HTML pages revalidate on deploy by default
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Daily fare JSON must revalidate so Book links never serve departed itineraries
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
