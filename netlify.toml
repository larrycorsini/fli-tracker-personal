# Fli-Tracker static dashboard — https://flights.larrycorsini.com
# Generated HTML lives in public/ (see generate_flight_report.py + daily_flight_search.sh)

[build]
  command = "echo 'Publishing committed public/'; test -f public/index.html"
  publish = "public"
  # Skip Git builds only when public/ (or this file) is unchanged vs last deploy.
  # Exit 0 = skip, exit 1 = build. Any other git exit (missing CACHED_COMMIT_REF
  # after a force-push) must be mapped to 1, or Netlify reports "no content change"
  # and leaves production on a stale SHA.
  ignore = "git rev-parse --verify --quiet $CACHED_COMMIT_REF >/dev/null && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify.toml; test $? -eq 0"

# Security headers for the public flight dashboard
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service worker must revalidate so daily deploys reach installed PWAs
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest can be cached briefly; HTML pages revalidate on deploy by default
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Daily fare JSON must revalidate so Book links never serve departed itineraries
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
